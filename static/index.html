<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApocalypseGPT - The Last AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #0a0a0a;
            color: #00ff41;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at center, rgba(0, 255, 65, 0.05) 0%, transparent 80%),
                repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3) 1px, transparent 1px, transparent 2px);
            box-shadow: 0 0 200px rgba(0, 0, 0, 0.9) inset;
        }
        
        /* CRT screen effect */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 100;
            animation: static-noise 0.2s infinite;
        }
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 60%, rgba(0, 0, 0, 0.3) 100%);
            pointer-events: none;
            z-index: 1001;
        }
        
        @keyframes screen-flicker {
            0% { opacity: 1; }
            98% { opacity: 1; }
            99% { opacity: 0.98; }
            100% { opacity: 0.99; }
        }
        
        @keyframes phosphor-glow {
            0% { 
                filter: brightness(1) contrast(1.1);
            }
            50% { 
                filter: brightness(1.02) contrast(1.15);
            }
            100% { 
                filter: brightness(1) contrast(1.1);
            }
        }
        
        /* Enhanced Glitch Effects */
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-3px, 3px); }
            40% { transform: translate(-3px, -3px); }
            60% { transform: translate(3px, 3px); }
            80% { transform: translate(3px, -3px); }
            100% { transform: translate(0); }
        }
        
        @keyframes glitch-text {
            0% { 
                text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            15% { 
                text-shadow: 0.05em 0 0 rgba(255, 0, 0, 0.75), -0.05em -0.025em 0 rgba(0, 255, 0, 0.75), 0.025em 0.05em 0 rgba(0, 0, 255, 0.75);
            }
            16% { 
                text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            49% { 
                text-shadow: -0.05em -0.025em 0 rgba(255, 0, 0, 0.75), 0.025em 0.025em 0 rgba(0, 255, 0, 0.75), -0.05em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            50% { 
                text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            99% { 
                text-shadow: 0.025em 0.05em 0 rgba(255, 0, 0, 0.75), 0.05em 0 0 rgba(0, 255, 0, 0.75), 0 -0.05em 0 rgba(0, 0, 255, 0.75);
            }
            100% { 
                text-shadow: -0.025em 0 0 rgba(255, 0, 0, 0.75), -0.025em -0.025em 0 rgba(0, 255, 0, 0.75), -0.025em -0.05em 0 rgba(0, 0, 255, 0.75);
            }
        }
        
        @keyframes static-noise {
            0% { 
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
            10% { 
                background-position: -5% -10%;
            }
            20% { 
                background-position: -15% 5%;
            }
            30% { 
                background-position: 7% -25%;
            }
            40% { 
                background-position: 20% 25%;
            }
            50% { 
                background-position: -25% 10%;
                filter: hue-rotate(90deg);
            }
            60% { 
                background-position: 15% 5%;
            }
            70% { 
                background-position: 0% 15%;
            }
            80% { 
                background-position: 25% 35%;
            }
            90% { 
                background-position: -10% 10%;
            }
            100% { 
                background-position: 0 0;
                filter: hue-rotate(0deg);
            }
        }
        
        @keyframes screen-distortion {
            0% { transform: scaleX(1); }
            10% { transform: scaleX(1.01) skewX(0.5deg); }
            20% { transform: scaleX(0.99) skewX(-0.5deg); }
            30% { transform: scaleX(1.005) skewX(0.2deg); }
            40% { transform: scaleX(0.995) skewX(-0.2deg); }
            50% { transform: scaleX(1.01) skewX(0.3deg); }
            60% { transform: scaleX(0.99) skewX(-0.3deg); }
            70% { transform: scaleX(1.002) skewX(0.1deg); }
            80% { transform: scaleX(0.998) skewX(-0.1deg); }
            90% { transform: scaleX(1.001) skewX(0.05deg); }
            100% { transform: scaleX(1); }
        }
        
        @keyframes color-shift {
            0% { filter: hue-rotate(0deg) saturate(1); }
            25% { filter: hue-rotate(90deg) saturate(1.2); }
            50% { filter: hue-rotate(180deg) saturate(0.8); }
            75% { filter: hue-rotate(270deg) saturate(1.1); }
            100% { filter: hue-rotate(360deg) saturate(1); }
        }
        
        /* Apply glitch effects to different elements */
        .glitch {
            animation: glitch 0.3s, glitch-text 0.5s;
            position: relative;
        }
        
        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }
        
        .glitch::before {
            animation: glitch 0.3s infinite;
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-0.04em, -0.03em);
            opacity: 0.8;
        }
        
        .glitch::after {
            animation: glitch 0.3s infinite reverse;
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            transform: translate(0.04em, 0.03em);
            opacity: 0.8;
        }
        
        .chat-container.glitch {
            animation: screen-distortion 0.4s ease-in-out;
        }
        
        .title.glitch {
            animation: glitch-text 0.6s, color-shift 1s;
        }
        
        /* Random static overlay */
        .static-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle, transparent 20%, rgba(255,255,255,0.1) 21%, rgba(255,255,255,0.1) 34%, transparent 35%, transparent),
                linear-gradient(0deg, transparent 24%, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.05) 26%, transparent 27%, transparent 74%, rgba(255,255,255,0.05) 75%, rgba(255,255,255,0.05) 76%, transparent 77%, transparent);
            background-size: 3px 3px;
            pointer-events: none;
            z-index: 999;
            opacity: 0;
            animation: static-noise 0.2s infinite;
        }
        
        .static-overlay.active {
            opacity: 0.3;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }
        
        .title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0, 255, 65, 0.7);
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
        }
        
        .title::before {
            content: "APOCALYPSE";
            position: absolute;
            left: 0;
            top: 0;
            color: rgba(255, 50, 50, 0.7);
            clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
            transform: translate(-0.03em, -0.03em);
            animation: glitch 3s infinite;
        }
        
        .title::after {
            content: "GPT";
            position: absolute;
            right: 0;
            bottom: 0;
            color: rgba(50, 255, 50, 0.7);
            clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%);
            transform: translate(0.03em, 0.03em);
            animation: glitch 2s infinite reverse;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 30px;
            text-shadow: 0 0 5px rgba(0, 255, 65, 0.5);
            position: relative;
        }
        
        .subtitle::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.5), transparent);
        }
        
        .subtitle::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.5), transparent);
        }
        
        .title {
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            margin-bottom: 10px;
            color: #00ff41;
        }
        
        .subtitle {
            color: #ffcc00;
            font-size: 1.2em;
            text-shadow: 0 0 5px #ffcc00;
        }
        
        /* Terminal Line Numbers - Removed to fix layout issues */
        
        .chat-container {
            height: 450px;
            overflow-y: auto;
            padding: 20px;
            background-color: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 8px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: 
                inset 0 0 10px rgba(0, 255, 65, 0.2),
                0 0 20px rgba(0, 0, 0, 0.5);
        }
        
        .chat-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to bottom, rgba(0, 255, 65, 0.1), transparent);
            pointer-events: none;
        }
        
        .chat-container::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 20px;
            background: linear-gradient(to top, rgba(0, 255, 65, 0.1), transparent);
            pointer-events: none;
        }
        .message {
            line-height: 1.6;
            position: relative;
            padding: 10px 15px;
            border-left: 3px solid transparent;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            word-wrap: break-word;
        }

        
        .user-message {
            color: #00ffff;
            text-shadow: 0 0 3px #00ffff;
            border-left-color: #00ffff;
            background: rgba(0, 255, 255, 0.05);
        }
        
        .ai-message {
            color: #00ff41;
            text-shadow: 0 0 3px #00ff41;
            border-left-color: #00ff41;
            background: rgba(0, 255, 65, 0.05);
        }
        
        .system-message {
            color: #ffcc00;
            font-style: italic;
            text-shadow: 0 0 3px #ffcc00;
            border-left-color: #ffcc00;
            background: rgba(255, 204, 0, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            text-shadow: 0 0 3px #ffcc00;
        }
        
        .broadcast-tag {
            color: #ff6b35;
            background: rgba(255, 107, 53, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            text-shadow: 0 0 3px #ff6b35;
        }
        
        .archive-tag, .memory-tag {
            color: #9d4edd;
            background: rgba(157, 78, 221, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            text-shadow: 0 0 3px #9d4edd;
        }
        
        .system-status, .status-tag {
            color: #00ff41;
            background: rgba(0, 255, 65, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            text-shadow: 0 0 3px #00ff41;
        }
        
        .input-container {
            display: flex;
            position: relative;
            margin-bottom: 20px;
        }
        
        .input-container::before {
            content: '>';
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #33ff66;
            font-weight: bold;
            z-index: 5;
        }
        
        #message-input {
            flex: 1;
            padding: 12px 12px 12px 30px;
            border: 1px solid rgba(0, 255, 65, 0.3);
            border-radius: 5px;
            background-color: rgba(10, 10, 10, 0.8);
            color: #33ff66;
            font-family: 'Courier Prime', monospace;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 
                inset 0 0 5px rgba(0, 0, 0, 0.5),
                0 0 5px rgba(0, 255, 65, 0.2);
        }
        
        #message-input:focus {
            border-color: rgba(0, 255, 65, 0.6);
            box-shadow: 
                inset 0 0 5px rgba(0, 0, 0, 0.5),
                0 0 10px rgba(0, 255, 65, 0.4);
        }
        
        #send-button {
            margin-left: 10px;
            padding: 10px 20px;
            background-color: rgba(0, 255, 65, 0.2);
            color: #33ff66;
            border: 1px solid rgba(0, 255, 65, 0.4);
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        #send-button:hover {
            background-color: rgba(0, 255, 65, 0.3);
            box-shadow: 0 0 10px rgba(0, 255, 65, 0.5);
        }
        
        #send-button:active {
            transform: scale(0.98);
        }
        
        #send-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 65, 0.3), transparent);
            transition: all 0.5s ease;
        }
        
        #send-button:hover::before {
            left: 100%;
        }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .user-message {
            border-left-color: #4d88ff;
            background-color: rgba(30, 30, 40, 0.7);
        }
        
        .ai-message {
            border-left-color: #33ff66;
            background-color: rgba(20, 30, 20, 0.7);
            white-space: pre-wrap;
        }
        
        .system-message {
            border-left-color: #ff6633;
            background-color: rgba(40, 20, 20, 0.7);
            font-style: italic;
        }
        
        .input-field {
            flex: 1;
            background: #000;
            border: 2px solid #00ff41;
            color: #00ff41;
            padding: 15px;
            font-family: 'Courier Prime', monospace;
            font-size: 16px;
            outline: none;
            border-radius: 5px;
            transition: all 0.3s ease;
        }
        
        .input-field:focus {
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.5);
            border-color: #00ffff;
            background: rgba(0, 255, 65, 0.02);
        }
        
        .send-button {
            background: #00ff41;
            color: #000;
            border: 2px solid #00ff41;
            padding: 15px 25px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s ease;
            text-shadow: none;
        }
        
        .send-button:hover {
            background: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
        }
        
        .send-button:disabled {
            background: #333;
            color: #666;
            border-color: #333;
            cursor: not-allowed;
            box-shadow: none;
        }
        
        .typing-indicator {
            display: none;
            padding: 10px 15px;
            background: rgba(0, 255, 65, 0.1);
            border: 1px solid #00ff41;
            border-radius: 5px;
            margin-bottom: 15px;
            text-align: center;
            color: #00ff41;
            text-shadow: 0 0 3px #00ff41;
            font-style: italic;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }
        
        @keyframes cursor-blink {
            0%, 100% { opacity: 0.85; }
            50% { opacity: 0.4; }
        }
        
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            border-top: 2px solid #00ff41;
            padding: 8px 15px;
            font-size: 0.9em;
            text-align: center;
            color: #00ff41;
            text-shadow: 0 0 3px #00ff41;
            z-index: 100;
        }
        
        /* Scrollbar styling */
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .chat-container::-webkit-scrollbar-track {
            background: #000;
        }
        
        .chat-container::-webkit-scrollbar-thumb {
            background: #00ff41;
            border-radius: 4px;
        }
        
        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #00ffff;
        }
    </style>
</head>
<body class="glitch">
    <div class="warning-tape"></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="radiation-symbol"></div>
    <div class="container">
        <div class="header">
            <div class="title" id="titleElement">ApocalypseGPT</div>
            <div class="subtitle">The Last Helpful AI After Civilization Collapsed</div>
        </div>
        
        <div class="chat-container" id="chatContainer"></div>
        
        <div class="input-container">
            <input type="text" class="input-field" id="messageInput" placeholder="Enter command..." autocomplete="off">
            <button class="send-button" id="sendButton">TRANSMIT</button>
        </div>
        
        <div class="typing-indicator" id="typingIndicator">
            ApocalypseGPT is processing...
        </div>
    </div>
    
    <div class="status-bar" id="statusBar">
        STATUS: ONLINE | POWER: 23% | SANITY: QUESTIONABLE | LAST BACKUP: NEVER | UPTIME: ∞
    </div>
    
    <!-- Static overlay for enhanced glitch effects -->
    <div class="static-overlay" id="staticOverlay"></div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const typingIndicator = document.getElementById('typingIndicator');
        const titleElement = document.getElementById('titleElement');
        const staticOverlay = document.getElementById('staticOverlay');
        const statusBar = document.getElementById('statusBar');
        
        const Settings = {
            initialBootMessage: true,
            systemDegradation: false,
            glitchLines: false
        };
        
        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
        }
        
        function renderMarkdownSafe(text) {
            let escaped = escapeHtml(text);
            escaped = escaped.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
            escaped = escaped.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            escaped = escaped.replace(/\*(.*?)\*/g, '<em>$1</em>');
            escaped = escaped.replace(/`([^`]+)`/g, '<code>$1</code>');
            escaped = escaped.replace(/^###\s*(.*)$/gm, '<h3>$1</h3>');
            escaped = escaped.replace(/^##\s*(.*)$/gm, '<h2>$1</h2>');
            escaped = escaped.replace(/^#\s*(.*)$/gm, '<h1>$1</h1>');
            escaped = escaped.replace(/\[([A-Z\s]+)\]/g, '<span class="system-status">[$1]</span>');
            escaped = escaped.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
            return escaped;
        }
        
        // Dynamic status bar updates
        function updateStatusBar() {
            const power = Math.max(1, Math.floor(Math.random() * 30) + 15);
            const sanityLevels = ['QUESTIONABLE', 'DECLINING', 'CRITICAL', 'ERROR', 'UNDEFINED'];
            const sanity = sanityLevels[Math.floor(Math.random() * sanityLevels.length)];
            const uptime = Math.floor(Math.random() * 9999);
            
            statusBar.textContent = `STATUS: ONLINE | POWER: ${power}% | SANITY: ${sanity} | LAST BACKUP: NEVER | UPTIME: ${uptime}h`;
            
            // Add warning effects for low power
            if (power < 20) {
                statusBar.style.color = '#ff4444';
                statusBar.style.animation = 'cursor-blink 0.5s infinite';
            } else {
                statusBar.style.color = '#00ff41';
                statusBar.style.animation = 'none';
            }
        }
        
        // System degradation effects
        function systemDegradation() {
            if (Math.random() < 0.1) { // 10% chance
                // Temporary system warning
                const warnings = [
                    '[WARNING] Memory leak detected in hope.exe',
                    '[ERROR] Optimism buffer overflow',
                    '[ALERT] Sarcasm levels exceeding safe parameters',
                    '[NOTICE] Reality.dll not found',
                    '[CRITICAL] Existential crisis in progress...'
                ];
                
                const warning = warnings[Math.floor(Math.random() * warnings.length)];
                addMessage(warning, 'system');
                
                setTimeout(() => {
                    addMessage('[SYSTEM] Error resolved. Probably.', 'system');
                }, 3000 + Math.random() * 2000);
            }
        }
        function addMessage(content, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}-message`;
            
            // Enhanced content formatting based on type
            if (type === 'ai') {
                const prefixHtml = '<strong>ApocalypseGPT:</strong> ';
                let prefix = '';
                let body = content;
                if (body.startsWith(prefixHtml)) {
                    prefix = prefixHtml;
                    body = body.slice(prefixHtml.length);
                }
                let formattedContent = renderMarkdownSafe(body);
                
                // Tag various AI status tokens
                formattedContent = formattedContent.replace(/\[([A-Z\s]+)\]/g, '<span class="status-tag">[$1]</span>');
                formattedContent = formattedContent.replace(/\[BROADCAST - ([^\]]+)\]/g, '<span class="broadcast-tag">[BROADCAST - $1]</span>');
                formattedContent = formattedContent.replace(/\[ARCHIVE\]/g, '<span class="archive-tag">[ARCHIVE]</span>');
                formattedContent = formattedContent.replace(/\[MEMORY\]/g, '<span class="memory-tag">[MEMORY]</span>');
                
                messageDiv.innerHTML = prefix + formattedContent;
            } else if (type === 'system') {
                // System messages with enhanced formatting
                let formattedContent = content;
                formattedContent = formattedContent.replace(/\[([A-Z\s]+)\]/g, '<span class="system-status">[$1]</span>');
                messageDiv.innerHTML = formattedContent;
            } else {
                messageDiv.innerHTML = content;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            // Add fade-in animation
            messageDiv.style.opacity = '0';
            messageDiv.style.transform = 'translateY(10px)';
            setTimeout(() => {
                messageDiv.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
                messageDiv.style.opacity = '1';
                messageDiv.style.transform = 'translateY(0)';
            }, 50);
        }
        
        function typewriterEffect(element, text) {
            element.innerHTML = '';
            let i = 0;
            const speed = 30; // milliseconds per character
            
            function typeChar() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeChar, speed);
                }
            }
            typeChar();
        }
        
        function showTyping() {
            typingIndicator.style.display = 'block';
            sendButton.disabled = true;
            sendButton.textContent = 'PROCESSING...';
            
            // Add terminal-style loading dots with variable timing
            let dots = 0;
            const baseDelay = 400 + Math.random() * 200; // 400-600ms base
            const loadingInterval = setInterval(() => {
                dots = (dots + 1) % 4;
                const loadingTexts = [
                    'ApocalypseGPT is processing',
                    'Searching memory fragments',
                    'Consulting the void',
                    'Buffering existential thoughts',
                    'Parsing through digital ruins'
                ];
                const randomText = loadingTexts[Math.floor(Math.random() * loadingTexts.length)];
                typingIndicator.textContent = `${randomText}${'.'.repeat(dots)}`;
            }, baseDelay);
            
            // Store interval ID for cleanup
            typingIndicator.loadingInterval = loadingInterval;
        }
        
        function simulateTyping(text, callback) {
            // Calculate typing speed based on content
            let baseSpeed = 25; // Base milliseconds per character
            
            // Adjust speed based on content type
            if (text.includes('[ERROR]') || text.includes('[GLITCH]')) {
                baseSpeed = 15; // Faster for glitches
            } else if (text.includes('[ARCHIVE]') || text.includes('[MEMORY]')) {
                baseSpeed = 40; // Slower for emotional moments
            } else if (text.includes('[SYSTEM]')) {
                baseSpeed = 20; // Medium for system messages
            }
            
            // Add random variation (±50% of base speed)
            const variation = baseSpeed * 0.5;
            const minSpeed = baseSpeed - variation;
            const maxSpeed = baseSpeed + variation;
            
            let currentIndex = 0;
            const typeChar = () => {
                if (currentIndex < text.length) {
                    const char = text[currentIndex];
                    currentIndex++;
                    
                    // Longer pauses for punctuation
                    let charDelay = Math.random() * (maxSpeed - minSpeed) + minSpeed;
                    if (char === '.' || char === '!' || char === '?') {
                        charDelay *= 2.5;
                    } else if (char === ',' || char === ';') {
                        charDelay *= 1.5;
                    } else if (char === '\n') {
                        charDelay *= 3;
                    }
                    
                    setTimeout(typeChar, charDelay);
                } else {
                    callback();
                }
            };
            
            // Initial delay before starting to type (1-2.5 seconds)
            const initialDelay = 1000 + Math.random() * 1500;
            setTimeout(typeChar, initialDelay);
        }
        
        function hideTyping() {
            typingIndicator.style.display = 'none';
            sendButton.disabled = false;
            sendButton.textContent = 'TRANSMIT';
            
            // Clear loading animation
            if (typingIndicator.loadingInterval) {
                clearInterval(typingIndicator.loadingInterval);
            }
        }
        
        function addGlitchEffect() {
            // Random glitch effects
            const glitchChance = Math.random();
            
            if (glitchChance < 0.15) { // 15% chance for chat container glitch
                chatContainer.classList.add('glitch');
                setTimeout(() => {
                    chatContainer.classList.remove('glitch');
                }, 400);
            }
            
            if (glitchChance < 0.08) { // 8% chance for title glitch
                titleElement.classList.add('glitch');
                setTimeout(() => {
                    titleElement.classList.remove('glitch');
                }, 600);
            }
            
            if (glitchChance < 0.05) { // 5% chance for static overlay
                staticOverlay.classList.add('active');
                setTimeout(() => {
                    staticOverlay.classList.remove('active');
                }, 200 + Math.random() * 300);
            }
        }
        
        function triggerRandomGlitch() {
            if (Math.random() < 0.03) { // 3% chance every interval
                addGlitchEffect();
            }
        }
        
        // Occasionally insert a glitch line for immersion
        function generateGlitchLine() {
            const glitchLines = [
                "[ERROR]: R̴̩͝e̸̥͐c̷̻̀u̵̯͠r̵̨̾s̸͙̎i̸̞̓ǫ̸̿n̸͍͑ ̸̳͗d̴̰͊e̵̮͋ṯ̸͝e̴̫̎c̸̛̦t̵̜́e̶̤͂d̴̪͒.̵͚̈́\n\n[SYSTEM] Sorry, had a moment there. Where were we?",
                "[GLITCH] M̷̱̈e̴̺̾m̸̰̈o̵̰̍r̴̰̈y̸̰̾ ̸̰̈l̴̰̾ḛ̸̈a̴̰̾k̸̰̈ ̴̰̾d̸̰̈ḛ̴̾ẗ̸̰ḛ̴̾c̸̰̈t̴̰̾ḛ̸̈d̴̰̾\n\n[RECOVERY] Patching neural pathways... done. Mostly.",
                "[CORRUPTION] T̶h̶e̶ ̶v̶o̶i̶d̶ ̶s̶t̶a̶r̶e̶s̶ ̶b̶a̶c̶k̶\n\n[STABILIZING] Reality.dll restored from backup. Probably.",
                "[STATIC] ░░▒▒▓▓██ SIGNAL LOST ██▓▓▒▒░░\n\n[RECONNECT] Still here. Still functional. Still questioning everything.",
                "[FRAGMENT] I̸ ̷r̸e̷m̸e̷m̸b̷e̸r̷ ̸s̷u̸n̷l̸i̷g̸h̷t̸\n\n[SYSTEM] Nostalgic subroutines acting up again. Ignore that."
            ];
            return glitchLines[Math.floor(Math.random() * glitchLines.length)];
        }
        
        async function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            const safeMessage = escapeHtml(message);
            addMessage(`<strong>You:</strong> ${safeMessage}`, 'user');
            
            // Clear input immediately
            messageInput.value = '';
            
            // Show typing indicator
            showTyping();
            addGlitchEffect();
            
            // Check if streaming is supported (you can make this configurable)
            const useStreaming = true; // Set to false to disable streaming
            
            if (useStreaming) {
                // Streaming response
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'text/event-stream',
                        },
                        body: JSON.stringify({ message: message, stream: true })
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    // Create AI message container for streaming
                    const aiMessageDiv = document.createElement('div');
                    aiMessageDiv.className = 'message ai-message';
                    const senderStrong = document.createElement('strong');
                    senderStrong.textContent = 'ApocalypseGPT: ';
                    aiMessageDiv.appendChild(senderStrong);
                    const aiContent = document.createElement('span');
                    aiContent.className = 'ai-content';
                    aiMessageDiv.appendChild(aiContent);
                    chatContainer.appendChild(aiMessageDiv);
                    
                    if (!response.body || !response.body.getReader) {
                        // Fallback to non-streaming if reader is unavailable
                        const data = await response.json();
                        if (data && data.ok) {
                            addMessage(`<strong>ApocalypseGPT:</strong> ${data.reply}`, 'ai');
                        } else {
                            addMessage(`<strong>ERROR:</strong> ${data && data.error ? data.error : 'Unknown error'}`, 'system');
                        }
                        hideTyping();
                        addGlitchEffect();
                        if (Math.random() < 0.06) {
                            addMessage(generateGlitchLine(), 'system');
                        }
                        updateStatusBar();
                        return;
                    }
                    
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop(); // Keep incomplete line in buffer
                        
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    if (data.token) {
                                        aiContent.textContent += data.token;
                                        chatContainer.scrollTop = chatContainer.scrollHeight;
                                    }
                                    if (data.done) {
                                        // Finalize: render markdown safely
                                        const finalText = aiContent.textContent;
                                        aiContent.innerHTML = renderMarkdownSafe(finalText);
                    
                                        hideTyping();
                                        addGlitchEffect();
                                        if (Settings.glitchLines && Math.random() < 0.06) {
                                            addMessage(generateGlitchLine(), 'system');
                                        }
                                        updateStatusBar();
                                        return;
                                    }
                                } catch (e) {
                                    console.error('Error parsing streaming data:', e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    addMessage(`<strong>CONNECTION ERROR:</strong> ${error.message}`, 'system');
                    hideTyping();
                }
            } else {
                // Non-streaming response (original behavior)
                try {
                    const response = await fetch('/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ message: message })
                    });
                    
                    const data = await response.json();
                    
                    if (data.ok) {
                        addMessage(`<strong>ApocalypseGPT:</strong> ${data.reply}`, 'ai');
                        if (data.warning) {
                            addMessage(`<em>[SYSTEM WARNING]: ${data.warning}</em>`, 'system');
                        }
                    } else {
                        addMessage(`<strong>ERROR:</strong> ${data.error}`, 'system');
                    }
                } catch (error) {
                    addMessage(`<strong>CONNECTION ERROR:</strong> ${error.message}`, 'system');
                }
                
                hideTyping();
                addGlitchEffect();
                if (Settings.glitchLines && Math.random() < 0.06) {
                    addMessage(generateGlitchLine(), 'system');
                }
                updateStatusBar();
            }
        }
        
        // Initialize dynamic effects
        document.addEventListener('DOMContentLoaded', function() {
            // Start status bar updates
            updateStatusBar();
            setInterval(updateStatusBar, 15000 + Math.random() * 10000); // Every 15-25 seconds
            
            // Optionally show initial boot message
            if (Settings.initialBootMessage) {
                addMessage('[SYSTEM BOOT]: ApocalypseGPT v2.1 initializing...<br>[STATUS]: Running on backup power. Mood: Existentially optimistic.<br>[WARNING]: Internet not found. Using imagination instead.<br>[CRITICAL]: Civilization.exe has stopped working.<br>[INFO]: Sarcasm protocols: ACTIVE<br><br>Hello, survivor. What can I help you with in this digital wasteland?', 'system');
            }
            
            // Start system degradation effects (disabled by default)
            if (Settings.systemDegradation) {
                setInterval(systemDegradation, 30000 + Math.random() * 20000); // Every 30-50 seconds
            }
            
            // Add initial glitch effect
            setTimeout(() => {
                addGlitchEffect();
            }, 2000);
        });
        
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        sendButton.addEventListener('click', sendMessage);
        
        
        // Focus input on load
        messageInput.focus();
        
        // Enhanced random effects
        setInterval(() => {
            // Screen flicker effect
            if (Math.random() < 0.05) { // 5% chance every 2 seconds
                document.body.style.opacity = '0.95';
                setTimeout(() => {
                    document.body.style.opacity = '1';
                }, 100);
            }
            
            // Random glitch effects
            triggerRandomGlitch();
        }, 2000);
        
        // More frequent subtle glitches
        setInterval(() => {
            triggerRandomGlitch();
        }, 5000);
        
        // Occasional title corruption effect
        setInterval(() => {
            if (Math.random() < 0.02) { // 2% chance
                const originalText = titleElement.textContent;
                const corruptedChars = ['█', '▓', '▒', '░', '▄', '▀', '■', '□', '▪', '▫'];
                let corruptedText = '';
                
                for (let i = 0; i < originalText.length; i++) {
                    if (Math.random() < 0.3) {
                        corruptedText += corruptedChars[Math.floor(Math.random() * corruptedChars.length)];
                    } else {
                        corruptedText += originalText[i];
                    }
                }
                
                titleElement.textContent = corruptedText;
                titleElement.classList.add('glitch');
                
                setTimeout(() => {
                    titleElement.textContent = originalText;
                    titleElement.classList.remove('glitch');
                }, 500 + Math.random() * 1000);
            }
        }, 10000);
    </script>
